<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <h1>Udemy Dark</h1>
  <label class="row"><span>Enabled</span><input type="checkbox" id="enabled"></label>
  <label class="row"><span>Brightness <output id="bv"></output></span>
    <input type="range" id="brightness" min="60" max="130"></label>
  <label class="row"><span>Contrast <output id="cv"></output></span>
    <input type="range" id="contrast" min="60" max="130"></label>
  <button id="reset">Reset</button>
  <script src="popup.js"></script>
</body>
</html>
